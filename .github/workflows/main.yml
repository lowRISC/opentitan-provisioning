name: CI
on: [push, pull_request]

jobs:
  # Run lint checks on codebase.
  lint:
    # https://github.com/actions/runner-images/blob/main/images/linux/Ubuntu2204-Readme.md
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
      - name: Run linter checks
        run: bazelisk test //quality/... --test_output=errors

  # Build and test everything in the codebase (except the FPGA tests).
  build_and_test:
    runs-on: ot-provisioning-self-hosted
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build everything
        run: |
          bazelisk build //...
          bazelisk build --//src/pa/services:use_vendor_shim //src/pa/services:pa
          bazelisk run //release:release -- \
              --norelease \
              --copy "${PWD}/artifacts" \
              "no_tag_not_a_release"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/*
      - name: Test everything
        # Skip running lint tests as those are run in a previous stage.
        run: bazelisk test --test_tag_filters=-lint,-fpga //...
      # Tagged `manual` (it needs podman and builds a container image), so it is
      # not covered by the wildcard above. This is the only check that actually
      # executes the Win32 artifact we ship.
      - name: Test Win32 ATE DLL
        if: always()
        run: bazelisk test //src/ate/test_programs:ate_dll_smoke_test --test_output=errors

  # Run integration tests.
  integration_tests:
    runs-on: ot-provisioning-self-hosted
    timeout-minutes: 60
    env:
      OT_PROV_ORCHESTRATOR_PATH: /home/ci/orchestrator/latest/orchestrator.zip
      OT_PROV_ORCHESTRATOR_UNPACK: /home/ci/orchestrator/latest/copy_files.sh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # TODO(timothytrippel): It is unclear why the `lfs: true` configuration
      # above is not sufficient on self hosted runners.
      - name: Initialize LFS objects
        run: git lfs pull
      - name: Run provisioning appliance load test (PQ)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-pq"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-pq ./tests/run_pa_loadtest.sh --pq
      - name: Run provisioning appliance load test (RSA)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-rsa"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-rsa ./tests/run_pa_loadtest.sh
      - name: Run TLS test (PQ)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-tls-pq"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-tls-pq ./tests/run_tls_test.sh --pq
      - name: Run TLS test (RSA)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-tls-rsa"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-tls-rsa ./tests/run_tls_test.sh
      # Same coverage as the TLS tests above, but driving the Win32 `ate.dll`
      # we ship to ATE vendors, from a container that stands in for a Windows
      # ATE machine.
      - name: Run Windows ATE DLL test (PQ)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-windll-pq"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-windll-pq ./tests/run_ate_dll_test.sh --pq
      - name: Run Windows ATE DLL test (RSA)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-windll-rsa"' EXIT
          OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-windll-rsa ./tests/run_ate_dll_test.sh
      - name: Run integration tests (SoftHSM2, PQ)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev-ate-pq"' EXIT
          OT_PROV_ORCHESTRATOR_PATH="${OT_PROV_ORCHESTRATOR_PATH}" OT_PROV_ORCHESTRATOR_UNPACK="${OT_PROV_ORCHESTRATOR_UNPACK}" OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev-ate-pq ./tests/run_ate_test.sh --pq
      - name: Run integration tests (SoftHSM2, RSA)
        if: always()
        run: |
          trap 'rm -rf "$(pwd)/.otvar-dev"' EXIT
          OT_PROV_ORCHESTRATOR_PATH="${OT_PROV_ORCHESTRATOR_PATH}" OT_PROV_ORCHESTRATOR_UNPACK="${OT_PROV_ORCHESTRATOR_UNPACK}" OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev ./tests/run_ate_test.sh
      # The following tests are temporarily disabled because the CI machine HSM is unavailable.
      # - name: Run provisioning appliance load test
      #   if: always()
      #   run: OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev ./tests/run_pa_loadtest.sh --prod
      # - name: Run TLS test
      #   if: always()
      #   run: OPENTITAN_VAR_DIR=$(pwd)/.otvar-dev ./tests/run_tls_test.sh --prod
      # - name: Run integration tests (Thales HSM)
      #   if: always()
      #   run: OT_PROV_ORCHESTRATOR_PATH="${OT_PROV_ORCHESTRATOR_PATH}" OT_PROV_ORCHESTRATOR_UNPACK="${OT_PROV_ORCHESTRATOR_UNPACK}" OPENTITAN_VAR_DIR=$(pwd)/.otvar-prod ./tests/run_ate_test.sh --prod

  # Run NixOS VM integration tests.
  nixos_integration_tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = file:///tmp/nix-bazel-cache?trusted=1
      - name: Restore Nix Bazel Dependencies Cache
        id: cache-bazel-deps
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-bazel-cache
          key: nix-bazel-deps-${{ hashFiles('flake.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'nix/bazel.nix', 'nix/packages/softhsm2.nix', 'nix/crypto-assets.nix') }}
          restore-keys: |
            nix-bazel-deps-
      - name: Prepare Nix Bazel Cache Directory
        run: |
          sudo mkdir -p -m 777 /tmp/nix-bazel-cache /tmp/nix-bazel-cache/nar
          sudo chmod -R 777 /tmp/nix-bazel-cache
      - name: Populate Nix Bazel Cache (on cache miss)
        if: steps.cache-bazel-deps.outputs.cache-hit != 'true'
        run: |
          nix build --no-link path:.#bazel-deps-cache -L
          sudo chmod -R 777 /tmp/nix-bazel-cache
          nix copy --to 'file:///tmp/nix-bazel-cache?compression=none' path:.#bazel-deps-cache
          sudo chmod -R 777 /tmp/nix-bazel-cache
      - name: Save Nix Bazel Dependencies Cache
        if: steps.cache-bazel-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nix-bazel-cache
          key: ${{ steps.cache-bazel-deps.outputs.cache-primary-key }}
      - name: Run NixOS Provisioning Appliance Integration Test
        run: |
          set -o pipefail
          nix flake check path:. -L 2>&1 | tee /tmp/nix-flake-check.log
      - name: Dump Nix derivation logs
        if: always()
        run: |
          mkdir -p /tmp/nix-logs
          for item in \
            "bazel-deps-cache:path:.#bazel-deps-cache" \
            "services:path:.#packages.x86_64-linux.all" \
            "test-binaries:path:.#packages.x86_64-linux.test-binaries" \
            "provisioning-appliance-vm-test:path:.#checks.x86_64-linux.provisioning-appliance"; do
            name="${item%%:*}"
            target="${item#*:}"
            echo "::group::nix log $target"
            nix log "$target" > "/tmp/nix-logs/${name}.log" 2>&1 || true
            cat "/tmp/nix-logs/${name}.log"
            echo "::endgroup::"
          done
      - name: Upload Nix flake check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-logs
          path: |
            /tmp/nix-flake-check.log
            /tmp/nix-logs/*.log


