name: CI
on: [push, pull_request]

jobs:
  # Run lint checks on codebase.
  lint:
    # https://github.com/actions/runner-images/blob/main/images/linux/Ubuntu2204-Readme.md
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
      - name: Run linter checks
        run: bazelisk test //quality/... --test_output=errors

  # Build and test everything in the codebase (except the FPGA tests).
  build_and_test:
    runs-on: ot-provisioning-self-hosted
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build everything
        run: |
          bazelisk build //...
          bazelisk build --//src/pa/services:use_vendor_shim //src/pa/services:pa
          bazelisk run //release:release -- \
              --norelease \
              --copy "${PWD}/artifacts" \
              "no_tag_not_a_release"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/*
      - name: Test everything
        # Skip running lint tests as those are run in a previous stage.
        run: bazelisk test --test_tag_filters=-lint,-fpga //...

  # Run NixOS VM integration tests.
  integration_tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = file:///tmp/nix-bazel-cache?trusted=1
      - name: Restore Nix Bazel Dependencies Cache
        id: cache-bazel-deps
        uses: actions/cache/restore@v4
        with:
          path: /tmp/nix-bazel-cache
          key: nix-bazel-deps-${{ hashFiles('flake.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'nix/bazel.nix', 'nix/packages/softhsm2.nix', 'nix/crypto-assets.nix') }}
          restore-keys: |
            nix-bazel-deps-
      - name: Prepare Nix Bazel Cache Directory
        run: |
          sudo mkdir -p -m 777 /tmp/nix-bazel-cache /tmp/nix-bazel-cache/nar
          sudo chmod -R 777 /tmp/nix-bazel-cache
      - name: Populate Nix Bazel Cache (on cache miss)
        if: steps.cache-bazel-deps.outputs.cache-hit != 'true'
        run: |
          nix build --no-link path:.#bazel-deps-cache -L
          sudo chmod -R 777 /tmp/nix-bazel-cache
          nix copy --to 'file:///tmp/nix-bazel-cache?compression=none' path:.#bazel-deps-cache
          sudo chmod -R 777 /tmp/nix-bazel-cache
      - name: Save Nix Bazel Dependencies Cache
        if: steps.cache-bazel-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/nix-bazel-cache
          key: ${{ steps.cache-bazel-deps.outputs.cache-primary-key }}
      - name: Run NixOS Provisioning Appliance Integration Test
        run: |
          set -o pipefail
          nix flake check path:. -L 2>&1 | tee /tmp/nix-flake-check.log
      - name: Dump Nix derivation logs
        if: always()
        run: |
          mkdir -p /tmp/nix-logs
          for item in \
            "bazel-deps-cache:path:.#bazel-deps-cache" \
            "services:path:.#packages.x86_64-linux.all" \
            "test-binaries:path:.#packages.x86_64-linux.test-binaries" \
            "provisioning-appliance-vm-test:path:.#checks.x86_64-linux.provisioning-appliance"; do
            name="${item%%:*}"
            target="${item#*:}"
            echo "::group::nix log $target"
            nix log "$target" > "/tmp/nix-logs/${name}.log" 2>&1 || true
            cat "/tmp/nix-logs/${name}.log"
            echo "::endgroup::"
          done
      - name: Upload Nix flake check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-flake-check-logs
          path: |
            /tmp/nix-flake-check.log
            /tmp/nix-logs/*.log


